<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>분산일 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --line: #d9e0e4;
      --text: #182127;
      --muted: #66737c;
      --price: #146c8c;
      --volume: #8aa4b1;
      --danger: #c83e32;
      --good: #24795a;
      --focus: #243b53;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    main,
    .header-inner {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 72px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .as-of {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }

    main {
      padding: 22px 0 40px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .index-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-weight: 680;
      cursor: pointer;
    }

    button:hover {
      border-color: #9cb3bd;
      background: #f9fbfc;
    }

    button:focus-visible {
      outline: 3px solid rgba(36, 59, 83, 0.22);
      outline-offset: 2px;
    }

    button.active {
      border-color: var(--focus);
      background: var(--focus);
      color: #ffffff;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .refresh-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      min-width: 140px;
    }

    .phase-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--muted);
      border-radius: 8px;
      background: var(--surface);
    }

    .phase-banner.confirmed {
      border-left-color: var(--good);
      background: #f2f9f5;
    }

    .phase-banner.pressure {
      border-left-color: #b7791f;
      background: #fdf7ec;
    }

    .phase-banner.correction {
      border-left-color: var(--danger);
      background: #fdf3f1;
    }

    .phase-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .phase-dot {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--muted);
      flex: none;
    }

    .phase-banner.confirmed .phase-dot { background: var(--good); }
    .phase-banner.pressure .phase-dot { background: #b7791f; }
    .phase-banner.correction .phase-dot { background: var(--danger); }

    .phase-label {
      font-size: 19px;
      font-weight: 780;
    }

    .phase-action {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .phase-side {
      text-align: right;
    }

    .phase-count {
      font-size: 14px;
      font-weight: 700;
    }

    .phase-cluster {
      margin-top: 4px;
      font-size: 12.5px;
      font-weight: 720;
      color: var(--danger);
    }

    .phase-cluster:empty {
      display: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric,
    .chart-panel,
    .table-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .metric {
      min-height: 96px;
      padding: 16px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 780;
      letter-spacing: 0;
    }

    .metric-detail {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .chart-panel {
      padding: 16px;
      margin-bottom: 16px;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 17px;
      font-weight: 740;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .chart-wrap {
      position: relative;
      height: 520px;
      min-height: 360px;
    }

    .tables {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 16px;
    }

    .table-panel {
      overflow: hidden;
    }

    .table-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 740;
    }

    .table-count {
      color: var(--muted);
      font-weight: 620;
    }

    .table-scroll {
      max-height: 390px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f3;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #fbfcfd;
      z-index: 1;
      color: var(--muted);
      font-weight: 720;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .negative {
      color: var(--danger);
      font-weight: 720;
    }

    .positive {
      color: var(--good);
      font-weight: 720;
    }

    .empty {
      color: var(--muted);
      padding: 18px 16px;
    }

    .error {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid #e2a29b;
      border-radius: 8px;
      background: #fff7f5;
      color: #8f271f;
      font-weight: 650;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      .summary-grid,
      .tables {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 720px) {
      main,
      .header-inner {
        width: min(100% - 24px, 1440px);
      }

      .header-inner,
      .toolbar,
      .chart-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar-actions {
        align-items: flex-start;
        flex-direction: column-reverse;
      }

      .as-of,
      .status {
        text-align: left;
        white-space: normal;
      }

      .summary-grid,
      .tables {
        grid-template-columns: 1fr;
      }

      .chart-wrap {
        height: 430px;
      }

      button {
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>분산일 대시보드</h1>
      <div class="as-of" id="asOf">데이터 대기 중</div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="index-buttons" id="indexButtons"></div>
      <div class="toolbar-actions">
        <button class="refresh-button" id="refreshButton" type="button" aria-label="데이터 새로고침">
          <span aria-hidden="true">↻</span>
          <span>새로고침</span>
        </button>
        <div class="status" id="status">초기화 중</div>
      </div>
    </div>

    <div class="error" id="errorBox"></div>

    <section class="phase-banner" id="phaseBanner" aria-label="시장 국면">
      <div class="phase-main">
        <span class="phase-dot" id="phaseDot" aria-hidden="true"></span>
        <div>
          <div class="phase-label" id="phaseLabel">-</div>
          <div class="phase-action" id="phaseAction">-</div>
        </div>
      </div>
      <div class="phase-side">
        <div class="phase-count" id="phaseCount">-</div>
        <div class="phase-cluster" id="phaseCluster"></div>
      </div>
    </section>

    <section class="summary-grid" aria-label="요약">
      <div class="metric">
        <div class="metric-label">유효 분산일 (25거래일 창)</div>
        <div class="metric-value" id="recent25Count">-</div>
        <div class="metric-detail" id="recent25Detail">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">최근 1년 분산일</div>
        <div class="metric-value" id="oneYearCount">-</div>
        <div class="metric-detail" id="oneYearDetail">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">최신 종가</div>
        <div class="metric-value" id="latestClose">-</div>
        <div class="metric-detail" id="latestChange">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">최신 거래량</div>
        <div class="metric-value" id="latestVolume">-</div>
        <div class="metric-detail" id="latestVolumeChange">-</div>
      </div>
    </section>

    <section class="chart-panel">
      <div class="chart-head">
        <div>
          <div class="chart-title" id="chartTitle">최근 1년 지수와 거래량</div>
        </div>
        <div class="legend" aria-label="범례">
          <span><i class="swatch" style="background: var(--price)"></i>종가</span>
          <span><i class="swatch" style="background: var(--volume)"></i>거래량</span>
          <span><i class="swatch" style="background: var(--danger)"></i>유효 분산일</span>
          <span><i class="swatch" style="border: 1.5px solid #9aa7ae; background: transparent"></i>소멸 분산일</span>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="marketChart"></canvas>
      </div>
    </section>

    <section class="tables" aria-label="분산일 목록">
      <div class="table-panel">
        <div class="table-title">
          <span>유효 분산일 (25거래일 창)</span>
          <span class="table-count" id="recent25TableCount">-</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>종가</th>
                <th>등락률</th>
                <th>거래량 증감률</th>
              </tr>
            </thead>
            <tbody id="recent25Rows"></tbody>
          </table>
          <div class="empty" id="recent25Empty">-</div>
        </div>
      </div>

      <div class="table-panel">
        <div class="table-title">
          <span>최근 1년</span>
          <span class="table-count" id="oneYearTableCount">-</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>종가</th>
                <th>등락률</th>
                <th>거래량 증감률</th>
              </tr>
            </thead>
            <tbody id="oneYearRows"></tbody>
          </table>
          <div class="empty" id="oneYearEmpty">-</div>
        </div>
      </div>
    </section>

    <footer id="sourceNote">분산일 기준: 전 거래일 대비 종가 0.2% 이상 하락 및 거래량 증가.</footer>
  </main>

  <script>
    const elements = {
      asOf: document.getElementById("asOf"),
      status: document.getElementById("status"),
      refreshButton: document.getElementById("refreshButton"),
      errorBox: document.getElementById("errorBox"),
      indexButtons: document.getElementById("indexButtons"),
      phaseBanner: document.getElementById("phaseBanner"),
      phaseLabel: document.getElementById("phaseLabel"),
      phaseAction: document.getElementById("phaseAction"),
      phaseCount: document.getElementById("phaseCount"),
      phaseCluster: document.getElementById("phaseCluster"),
      recent25Count: document.getElementById("recent25Count"),
      recent25Detail: document.getElementById("recent25Detail"),
      oneYearCount: document.getElementById("oneYearCount"),
      oneYearDetail: document.getElementById("oneYearDetail"),
      latestClose: document.getElementById("latestClose"),
      latestChange: document.getElementById("latestChange"),
      latestVolume: document.getElementById("latestVolume"),
      latestVolumeChange: document.getElementById("latestVolumeChange"),
      chartTitle: document.getElementById("chartTitle"),
      recent25Rows: document.getElementById("recent25Rows"),
      recent25Empty: document.getElementById("recent25Empty"),
      oneYearRows: document.getElementById("oneYearRows"),
      oneYearEmpty: document.getElementById("oneYearEmpty"),
      recent25TableCount: document.getElementById("recent25TableCount"),
      oneYearTableCount: document.getElementById("oneYearTableCount"),
      sourceNote: document.getElementById("sourceNote"),
    };

    const numberFormat = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 2 });
    const integerFormat = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 0 });
    const compactFormat = new Intl.NumberFormat("ko-KR", {
      notation: "compact",
      maximumFractionDigits: 1,
    });

    let activeIndex = "kospi";
    let indexList = [];
    let chart = null;
    let isLoading = false;

    function formatNumber(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      return numberFormat.format(value);
    }

    function formatVolume(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      return value >= 1000000 ? compactFormat.format(value) : integerFormat.format(value);
    }

    function formatPct(value) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      const sign = value > 0 ? "+" : "";
      return `${sign}${numberFormat.format(value)}%`;
    }

    function pctClass(value) {
      if (value < 0) return "negative";
      if (value > 0) return "positive";
      return "";
    }

    function setStatus(message) {
      elements.status.textContent = message;
    }

    function setLoading(loading) {
      isLoading = loading;
      elements.refreshButton.disabled = loading;
      for (const button of elements.indexButtons.querySelectorAll("button")) {
        button.disabled = loading;
      }
    }

    function setError(message) {
      elements.errorBox.textContent = message;
      elements.errorBox.style.display = message ? "block" : "none";
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        cache: "no-store",
        headers: { "Accept": "application/json" },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.error || `요청 실패: ${response.status}`);
      }
      return body;
    }

    async function loadIndexes() {
      const payload = await fetchJson("/api/indexes");
      indexList = payload.indexes;
      elements.indexButtons.innerHTML = "";

      for (const item of indexList) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.name;
        button.dataset.index = item.id;
        button.addEventListener("click", () => {
          if (isLoading) return;
          activeIndex = item.id;
          loadData(item.id);
        });
        elements.indexButtons.appendChild(button);
      }
    }

    function updateButtons() {
      for (const button of elements.indexButtons.querySelectorAll("button")) {
        button.classList.toggle("active", button.dataset.index === activeIndex);
      }
    }

    async function loadData(indexId) {
      activeIndex = indexId;
      updateButtons();
      setError("");
      setLoading(true);
      setStatus("데이터 불러오는 중");

      try {
        const payload = await fetchJson(`/api/data?index=${encodeURIComponent(indexId)}`);
        render(payload);
        setStatus("완료");
      } catch (error) {
        setStatus("오류");
        setError(error.message || "데이터를 불러오지 못했습니다.");
      } finally {
        setLoading(false);
      }
    }

    async function refreshData() {
      if (isLoading) return;
      activeIndex = activeIndex || "kospi";
      updateButtons();
      setError("");
      setLoading(true);
      setStatus("새로고침 중");

      try {
        const url = `/api/data?index=${encodeURIComponent(activeIndex)}&refresh=1&_=${Date.now()}`;
        const payload = await fetchJson(url);
        render(payload);
        setStatus("완료");
      } catch (error) {
        setStatus("오류");
        setError(error.message || "데이터를 새로고침하지 못했습니다.");
      } finally {
        setLoading(false);
      }
    }

    function render(payload) {
      const summary = payload.summary;
      const latest = payload.latest;
      const index = payload.index;

      const phase = payload.phase || {};
      const cluster = payload.cluster || {};
      const activeCount = summary.activeDistributionCount ?? summary.recent25DistributionCount;

      elements.asOf.textContent = `${index.name} 기준일 ${payload.asOf}`;
      elements.phaseBanner.className = `phase-banner ${phase.level || ""}`;
      elements.phaseLabel.textContent = phase.label || "-";
      elements.phaseAction.textContent = phase.action || "";
      elements.phaseCount.textContent = `유효 분산일 ${activeCount}일`;
      elements.phaseCluster.textContent = cluster.warning
        ? `⚠ 최근 ${cluster.windowDays}거래일에 ${cluster.count}일 집중 — 조정 임박 신호`
        : "";

      elements.recent25Count.textContent = `${activeCount}일`;
      elements.recent25Detail.textContent = `창 내 발생 ${summary.recent25DistributionCount}일 중 (5% 회복·기간경과 제외)`;
      elements.oneYearCount.textContent = `${summary.oneYearDistributionCount}일`;
      elements.oneYearDetail.textContent = `${summary.oneYearTradingDays}거래일 중 (참고용)`;
      elements.latestClose.textContent = formatNumber(latest.close);
      elements.latestChange.textContent = formatPct(latest.closeChangePct);
      elements.latestChange.className = `metric-detail ${pctClass(latest.closeChangePct)}`;
      elements.latestVolume.textContent = formatVolume(latest.volume);
      elements.latestVolumeChange.textContent = formatPct(latest.volumeChangePct);
      elements.latestVolumeChange.className = `metric-detail ${pctClass(latest.volumeChangePct)}`;
      elements.chartTitle.textContent = `${index.name} 최근 1년 지수와 거래량`;
      elements.sourceNote.textContent = `출처: ${payload.source}. 분산일 = 전 거래일 대비 종가 0.2%↓ + 거래량 증가. 유효 분산일 = 25거래일 창 내 미소멸(지수가 해당일 종가 대비 5%↑ 상승 시 소멸). 분산일은 후행 지표로, 확인 신호이지 예측 신호가 아닙니다.`;

      renderChart(payload);
      renderRows(elements.recent25Rows, elements.recent25Empty, payload.activeDistributionDays);
      renderRows(elements.oneYearRows, elements.oneYearEmpty, payload.oneYearDistributionDays);
      elements.recent25TableCount.textContent = `${payload.activeDistributionDays.length}일`;
      elements.oneYearTableCount.textContent = `${payload.oneYearDistributionDays.length}일`;
    }

    function renderRows(tbody, emptyElement, rows) {
      tbody.innerHTML = "";
      emptyElement.style.display = rows.length ? "none" : "block";
      emptyElement.textContent = "분산일 없음";

      for (const row of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.date}</td>
          <td>${formatNumber(row.close)}</td>
          <td class="${pctClass(row.closeChangePct)}">${formatPct(row.closeChangePct)}</td>
          <td class="${pctClass(row.volumeChangePct)}">${formatPct(row.volumeChangePct)}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function renderChart(payload) {
      const labels = payload.series.map((row) => row.date);
      const closeData = payload.series.map((row) => row.close);
      const volumeData = payload.series.map((row) => row.volume);
      const activeData = payload.series.map((row) => row.active ? row.close : null);
      const expiredData = payload.series.map((row) => (row.distribution && !row.active) ? row.close : null);

      const context = document.getElementById("marketChart").getContext("2d");
      if (chart) chart.destroy();

      chart = new Chart(context, {
        data: {
          labels,
          datasets: [
            {
              type: "bar",
              label: "거래량",
              data: volumeData,
              yAxisID: "volume",
              backgroundColor: "rgba(138, 164, 177, 0.28)",
              borderColor: "rgba(138, 164, 177, 0.5)",
              borderWidth: 1,
              barPercentage: 0.9,
              categoryPercentage: 0.9,
              order: 3,
            },
            {
              type: "line",
              label: "종가",
              data: closeData,
              yAxisID: "price",
              borderColor: "#146c8c",
              backgroundColor: "rgba(20, 108, 140, 0.08)",
              borderWidth: 2,
              pointRadius: 0,
              tension: 0.18,
              order: 1,
            },
            {
              type: "line",
              label: "소멸 분산일",
              data: expiredData,
              yAxisID: "price",
              showLine: false,
              pointRadius: 3.5,
              pointHoverRadius: 6,
              pointBackgroundColor: "rgba(255,255,255,0)",
              pointBorderColor: "#9aa7ae",
              pointBorderWidth: 1.5,
              order: 0,
            },
            {
              type: "line",
              label: "유효 분산일",
              data: activeData,
              yAxisID: "price",
              showLine: false,
              pointRadius: 4.5,
              pointHoverRadius: 7,
              pointBackgroundColor: "#c83e32",
              pointBorderColor: "#ffffff",
              pointBorderWidth: 1.5,
              order: 0,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false,
          },
          plugins: {
            legend: {
              display: false,
            },
            tooltip: {
              callbacks: {
                afterBody(items) {
                  const row = payload.series[items[0].dataIndex];
                  if (!row) return "";
                  const lines = [
                    `등락률: ${formatPct(row.closeChangePct)}`,
                    `거래량 증감: ${formatPct(row.volumeChangePct)}`,
                  ];
                  if (row.distribution) {
                    lines.push(row.active ? "유효 분산일" : `소멸 분산일 (${row.expiredReason || "소멸"})`);
                  }
                  return lines;
                },
              },
            },
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: {
                maxTicksLimit: 10,
                maxRotation: 0,
              },
            },
            price: {
              position: "left",
              grid: { color: "rgba(24, 33, 39, 0.08)" },
              ticks: {
                callback: (value) => formatNumber(value),
              },
            },
            volume: {
              position: "right",
              grid: { display: false },
              beginAtZero: true,
              ticks: {
                callback: (value) => formatVolume(value),
              },
            },
          },
        },
      });
    }

    async function boot() {
      try {
        elements.refreshButton.addEventListener("click", refreshData);
        await loadIndexes();
        await loadData(activeIndex);
      } catch (error) {
        setStatus("오류");
        setError(error.message || "초기화 실패");
      }
    }

    boot();
  </script>
</body>
</html>
